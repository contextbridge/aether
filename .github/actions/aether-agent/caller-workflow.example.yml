# Template: run the Aether agent on labels and comments in your repository.
#
# 1. Copy this file to .github/workflows/aether-agent.yml and adapt it to your
#    repository (repository-local callers can keep `uses: ./...`; cross-repo
#    callers pin a ref of this repository instead):
#
#        uses: contextbridge/aether/.github/actions/aether-agent@<ref>
#
# 2. Check in the settings file named by `settings-file` (default
#    .aether/github.settings.json) defining the agents that `label-agent-map`
#    references. A minimal two-agent file:
#
#        {
#          "agents": [
#            {
#              "name": "Planner",
#              "model": "openrouter:vendor/model",
#              "reasoningEffort": "high",
#              "userInvocable": true,
#              "agentInvocable": false
#            },
#            {
#              "name": "Builder",
#              "model": "deepseek:deepseek-chat",
#              "reasoningEffort": "high",
#              "userInvocable": true,
#              "agentInvocable": false
#            }
#          ]
#        }
#
# 3. Add the secrets you wire below. With App auth that is the App id and
#    private key; with token auth, only `github-token` is needed. API keys are
#    only required for the providers your settings file references, and
#    `aws-role-to-assume` only for Bedrock-backed models.

name: Aether agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aether-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    name: Aether agent
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    # Label matching (issue-label) is enforced inside the action, so any
    # `issues: [labeled]` run is safe to forward. Comments must use the
    # comment-prefix and come from trusted authors.
    if: >-
      github.event_name == 'issues' ||
      (github.event.comment.body != null
       && startsWith(github.event.comment.body, '/aether')
       && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    environment: ci
    steps:
      # Optional: install the toolchains your agent needs to build and test
      # this repository. Toolchain steps are caller-owned — the action only
      # installs the aether CLI. These run before the action checks out the
      # default branch, so add your own shallow checkout first if you need
      # repo files (mise.toml, lockfiles) here. Pin any third-party actions
      # you add to a full commit SHA.
      #
      # - name: Checkout repository
      #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      #   with:
      #     persist-credentials: false
      # - name: Install system dependencies
      #   run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      # - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # - name: Install JavaScript dependencies
      #   run: pnpm install --frozen-lockfile

      - name: Run Aether
        uses: ./.github/actions/aether-agent
        with:
          # Auth: GitHub App (recommended, scopes itself to this repository)
          # or a token with contents/issues/pull-requests write.
          app-id: ${{ secrets.AETHER_APP_ID }}
          app-private-key: ${{ secrets.AETHER_APP_PRIVATE_KEY }}
          # github-token: ${{ secrets.GITHUB_TOKEN }}
          # AWS Bedrock OIDC — omit to skip when no Bedrock models are used.
          aws-role-to-assume: ${{ secrets.AETHER_BEDROCK_ROLE }}
          # API keys for the providers your agents use.
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Overrides for the defaults — see action.yml for the full list.
          # label-agent-map: >-
          #   {"aether-docs":{"agent":"Builder","mode":"implement"},
          #    "":{"agent":"Builder","mode":"implement"}}
          # issue-label: assign-agent
          # comment-prefix: /aether
