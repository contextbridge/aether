version: 2
updates:
  - package-ecosystem: cargo
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    directories:
      - /
      - /crates/acp-utils
      - /crates/aether-auth
      - /crates/aether-cli
      - /crates/aether-core
      - /crates/aether-evals
      - /crates/aether-lspd
      - /crates/aether-project
      - /crates/aether-schemas
      - /crates/aether-session-index
      - /crates/aether-telemetry
      - /crates/doctest
      - /crates/internal-evals
      - /crates/llm
      - /crates/llm-codegen
      - /crates/mcp-servers
      - /crates/mcp-utils
      - /crates/tui
      - /crates/utils
      - /crates/wisp
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    directories:
      - /.aether
      - /.contextbridge
      - /crates/internal-evals/examples
      - /packages/aether-evals/test/fixtures/sdk-weather-agent
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: github-actions
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
    directories:
      - /
      - /.github/actions/fetch-release-secrets
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: npm
    groups:
      npm-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      npm-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    directory: /
    cooldown:
      default-days: 3
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pre-commit-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      rust-toolchain-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
