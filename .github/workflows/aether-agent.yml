name: Aether agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aether-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    name: Aether agent
    permissions:
      contents: read
      id-token: write
    if: >-
      (github.event_name == 'issues'
       && github.event.label.name == 'assign-agent') ||
      (github.event_name == 'issue_comment'
       && github.event.issue.pull_request != null
       && startsWith(github.event.comment.body, '/aether')
       && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
       && startsWith(github.event.comment.body, '/aether')
       && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ci
    steps:
      # Everything the agent needs to build, lint, and test this repository is
      # caller-owned toolchain setup; the reusable action only installs the
      # aether CLI. The action checks out the default branch again with full
      # history, so this shallow checkout just provides mise.toml and the
      # lockfiles the toolchain steps below read.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Aether agent
        uses: $/.github/actions/aether-agent
        with:
          app-id: ${{ secrets.CB_PR_AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.CB_PR_AUTOMATION_APP_PRIVATE_KEY }}
          aws-role-to-assume: arn:aws:iam::212467111133:role/GitHubActionsBedrockInference-aether
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
