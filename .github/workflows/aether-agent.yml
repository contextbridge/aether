name: Aether agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

env:
  PLANS_DIR: docs/aether/plans

concurrency:
  group: aether-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    name: Aether agent
    if: >-
      (github.event_name == 'issues'
       && contains(fromJSON('["aether:plan", "aether:implement"]'), github.event.label.name)) ||
      (github.event_name != 'issues'
       && contains(github.event.comment.body, '@aether')
       && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci
    steps:
      - name: Generate ContextBridge app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CB_PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CB_PR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: contextbridge
          repositories: aether

      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: ./scripts/aether-agent/resolve-target

      - name: Acknowledge the request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            issue_comment) path="/repos/$REPO/issues/comments/$COMMENT_ID/reactions" ;;
            pull_request_review_comment) path="/repos/$REPO/pulls/comments/$COMMENT_ID/reactions" ;;
            *) exit 0 ;;
          esac

          gh api --silent --method POST "$path" -f content=eyes

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Prepare branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ steps.target.outputs.branch }}
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail

          user_id="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq '.id')"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch "$BRANCH"
          else
            git switch --create "$BRANCH" "origin/$BASE"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: jdx/mise-action@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest released Aether
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/aether-cargo"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/contextbridge/aether/releases/latest/download/aether-agent-cli-installer.sh \
            | sh -s -- --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/aether" --version

      - name: Build prompt
        id: prompt
        env:
          MODE: ${{ steps.target.outputs.mode }}
          NUMBER: ${{ steps.target.outputs.number }}
          BASE: ${{ steps.target.outputs.base }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          COMMENT_LINE: ${{ github.event.comment.line }}
          COMMENT_DIFF_HUNK: ${{ github.event.comment.diff_hunk }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
        run: ./scripts/aether-agent/build-prompt

      - name: Run Aether
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROMPT_PATH: ${{ steps.prompt.outputs.path }}
        run: |
          set -euo pipefail
          aether headless \
            --agent Cheap \
            --cwd "$GITHUB_WORKSPACE" \
            --mcp-config .aether/github-agent/mcp.json \
            --output json \
            --events text,tool_call,tool_result,tool_error,turn_ended \
            < "$PROMPT_PATH" \
            | tee "$RUNNER_TEMP/aether-headless.jsonl"

      - name: Commit and push
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.target.outputs.branch }}
          NUMBER: ${{ steps.target.outputs.number }}
          MODE: ${{ steps.target.outputs.mode }}
          START_SHA: ${{ steps.branch.outputs.sha }}
        run: ./scripts/aether-agent/commit-and-push

      - name: Open pull request
        id: pr
        if: steps.target.outputs.mode != 'pr' && steps.push.outputs.pushed == 'true'
        env:
          MODE: ${{ steps.target.outputs.mode }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.target.outputs.branch }}
          BASE: ${{ steps.target.outputs.base }}
          NUMBER: ${{ steps.target.outputs.number }}
          SUBJECT: ${{ steps.push.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/aether-agent/open-pull-request

      - name: Mark pull request ready
        if: steps.push.outputs.implemented == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: gh pr ready "$NUMBER"

      - name: Report back
        if: always() && steps.target.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ steps.target.outputs.mode }}
          NUMBER: ${{ steps.target.outputs.number }}
          BRANCH: ${{ steps.target.outputs.branch }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          FAILED: ${{ contains(fromJSON('["failure", "cancelled"]'), job.status) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/aether-agent/report-back
