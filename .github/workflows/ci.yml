# Generated by framer. Do not edit by hand: change .framer/src/main.rs and run `cargo framer`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - name: Check formatting
        run: just fmt-check
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: $/.github/actions/setup-workspace
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy check
        run: just lint
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: $/.github/actions/setup-workspace
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: just test
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: $/.github/actions/setup-workspace
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm fmt-check
      - name: Typecheck
        run: pnpm sdk:typecheck
      - name: Build SDK
        run: pnpm sdk:build
      - name: Build aether CLI
        run: cargo build -p aether-agent-cli
      - name: Test
        run: pnpm sdk:test
      - name: Typecheck evals
        run: pnpm evals:typecheck
      - name: Build evals
        run: pnpm evals:build
      - name: Test evals
        run: pnpm evals:test
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: $/.github/actions/setup-workspace
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check documentation
        run: just doc-check
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm fmt-check
      - name: Typecheck website
        run: pnpm website:check
      - name: Build website
        run: pnpm website:build
  framer:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Check generated files are up to date
        run: cargo run --locked --manifest-path .framer/Cargo.toml -- --check
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
