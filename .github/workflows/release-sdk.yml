name: Release TypeScript packages

on:
  push:
    branches: [main]
    paths:
      - "packages/aether-sdk/package.json"
      - "packages/aether-evals/package.json"
      - "packages/aether-browser/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/checkout-diff

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false

      - name: Setup npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm sdk:build

      - name: Build evals
        run: pnpm evals:build

      - name: Build browser client
        run: pnpm browser:build

      # pnpm -r publishes the SDK before evals, stops on the first failure, and skips versions already on npm.
      - name: Publish
        run: pnpm -r --filter @aether-agent/sdk --filter @aether-agent/evals --filter @aether-agent/browser publish --access public --provenance --no-git-checks
