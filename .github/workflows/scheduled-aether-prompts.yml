name: Scheduled Aether prompts

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-prompts:
    name: Discover scheduled prompts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prompts.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build prompt matrix
        id: prompts
        shell: bash
        run: |
          set -euo pipefail

          prompt_dir=".aether/scheduled-prompts"
          mapfile -t prompts < <(find "$prompt_dir" -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)

          if (( ${#prompts[@]} == 0 )); then
            echo "No scheduled prompts found in $prompt_dir." >&2
            exit 1
          fi

          entries=()
          for filename in "${prompts[@]}"; do
            id="${filename%.md}"
            if [[ ! "$id" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              echo "Invalid scheduled prompt filename: $filename" >&2
              exit 1
            fi
            entries+=("$(jq -cn --arg id "$id" --arg path "$prompt_dir/$filename" '{id: $id, path: $path}')")
          done

          matrix="$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run-prompt:
    name: Run ${{ matrix.prompt.id }}
    needs: discover-prompts
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prompt: ${{ fromJSON(needs.discover-prompts.outputs.matrix).include }}
    concurrency:
      group: scheduled-aether-${{ matrix.prompt.id }}
      cancel-in-progress: false
    steps:
      - name: Generate ContextBridge app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CB_PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CB_PR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: contextbridge
          repositories: aether
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Bedrock credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          role-to-assume: arn:aws:iam::212467111133:role/GitHubActionsBedrockInference-aether

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest released Aether
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/aether-cargo"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/contextbridge/aether/releases/latest/download/aether-agent-cli-installer.sh \
            | sh -s -- --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/aether" --version

      - name: Run Aether prompt
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROMPT_PATH: ${{ matrix.prompt.path }}
        run: |
          set -euo pipefail
          aether headless \
            --agent Cheap \
            --cwd "$GITHUB_WORKSPACE" \
            --output json \
            --events text,tool_call,tool_result,tool_error,turn_ended \
            < "$PROMPT_PATH" \
            | tee "$RUNNER_TEMP/aether-headless.jsonl"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/aether/${{ matrix.prompt.id }}
          delete-branch: true
          title: "chore: scheduled ${{ matrix.prompt.id }}"
          commit-message: "chore: scheduled ${{ matrix.prompt.id }}"
          labels: |
            automated
            aether
          body: |
            ## Scheduled Aether task

            Prompt: `${{ matrix.prompt.path }}`

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Repository CI runs automatically on this pull request.
