[workspace]
resolver = "3"
members = ["crates/*", "packages/aether-browser"]

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
pub_underscore_fields = "allow"
absolute_paths = "warn"

[workspace.dependencies]
aether-sessions = { path = "crates/aether-sessions", version = "0.3.18" }

# AWS SDK
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.133.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.8.1"
aws-smithy-eventstream = "0.61.4"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"

# Async runtime
tokio = { version = "^1.52.3" }
tokio-stream = { version = "^0.1.18", features = ["io-util"] }
tokio-util = "^0.7.18"
futures = "^0.3.32"
async-stream = "^0.3.6"
eventsource-stream = "^0.2"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ACP
agent-client-protocol = { version = "=3.2.0", features = ["unstable_protocol_v2", "unstable_session_compaction"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# MCP and API clients
rmcp = { version = "^3.5.1", default-features = false }
sse-stream = "0.3.0"
reqwest = { version = "^0.13.4", default-features = false, features = ["json", "query", "rustls", "http2", "stream"] }
oauth2 = { version = "5.0", default-features = false }
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }
url = "2.5"
axum = "0.8.9"
http = "1.5.0"
tower = "0.5.3"
tower-http = "0.7.1"

# LSP types - shared across packages
lsp-types = "0.97"

# Schema and validation
schemars = { version = "^1.2.1", features = ["derive"] }

# Utilities
chrono = { version = "^0.4.45", features = ["serde"] }
uuid = { version = "1.23", features = ["v4"] }
regex = "^1.12.4"
sha2 = "0.11"
base16ct = { version = "1.0", features = ["alloc"] }
base64 = "0.23"
noyalib = "0.0.54"
htmd = "0.5"
dom_smoothie = "0.18"

# Encryption
age = "0.12.1"

# Error handling
thiserror = "2.0"

# Storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Unix-specific
nix = { version = "0.31", default-features = false }
libc = "0.2"

# File system and pattern matching
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
glob = "0.3"
globset = "0.4"
ignore = "0.4"

# Terminal UI
clankerdiff-core = { version = "0.3.3" }
clankerdiff-ratatui = { version = "0.3.3", features = ["crossterm-backend"] }
clankerdiff-git = { version = "0.3.3" }
clankerdiff-protocol = { version = "0.3.3" }
clankerdiff-server = { version = "0.3.3" }
clankerdiff-client = { version = "0.3.3", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "scrolling-regions"] }
nucleo = "0.5.0"
mime_guess = "2"
unicode-width = "0.2.2"

# Desktop UI
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-base = "=0.7.0"
clankerdiff-gpui = { path = "../diff/crates/diff-gpui" }
clankerdiff-markdown = { version = "0.3.3" }
clankerdiff-syntax = { version = "0.3.3" }
clankerdiff-theme = { version = "0.3.3" }

# Wasm
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = "0.3.105"
js-sys = "0.3.105"
serde-wasm-bindgen = "0.6.5"
gloo-net = { version = "0.7.0", default-features = false }
wasm-bindgen-test = "0.3.79"

# Testing
tempfile = "3.27"
async-trait = "0.1"
testcontainers = "0.28.0"

# Every clankerdiff crate in the graph must resolve to ../diff, so clankerdiff-gpui (path-only) shares types with the rest.
# gpui-pre resolves to clankerdiff's vendored copy, which carries the variable-height `list` scroll fix.
[patch.crates-io]
gpui-pre = { path = "../diff/patches/gpui" }
clankerdiff-client = { path = "../diff/crates/diff-client" }
clankerdiff-core = { path = "../diff/crates/diff-core" }
clankerdiff-fingerprint = { path = "../diff/crates/diff-fingerprint" }
clankerdiff-git = { path = "../diff/crates/diff-git" }
clankerdiff-markdown = { path = "../diff/crates/diff-markdown" }
clankerdiff-protocol = { path = "../diff/crates/diff-protocol" }
clankerdiff-ratatui = { path = "../diff/crates/diff-ratatui" }
clankerdiff-server = { path = "../diff/crates/diff-server" }
clankerdiff-syntax = { path = "../diff/crates/diff-syntax" }
clankerdiff-theme = { path = "../diff/crates/diff-theme" }
clankerdiff-watch = { path = "../diff/crates/diff-watch" }

[profile.dev]
debug = 1

[profile.dist]
inherits = "release"
lto = "thin"
