[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
pub_underscore_fields = "allow"
absolute_paths = "warn"

[workspace.dependencies]
aether-sessions = { path = "crates/aether-sessions", version = "0.1.3" }

# AWS SDK
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.133.0"
# Capped below 1.5.0: it makes DeferredSignerSender::send generic, which breaks
# type inference in aws-runtime 1.7.4 (latest). Lift once aws-runtime ships a fix.
aws-smithy-types = ">=1.4.9, <1.7.0"
aws-smithy-runtime-api = "1.14.0"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"

# Async runtime
tokio = { version = "^1.52.3" }
tokio-stream = { version = "^0.1.18", features = ["io-util"] }
tokio-util = "^0.7.18"
futures = "^0.3.32"
async-stream = "^0.3.6"
eventsource-stream = "^0.2"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ACP
agent-client-protocol = { version = "2.0.0", features = ["unstable_elicitation"] }

# MCP and API clients
rmcp = { version = "^3.1.1", default-features = false }
async-openai = { version = "^0.41.0", features = ["byot", "chat-completion", "responses"] }
reqwest = { version = "^0.13.4", default-features = false, features = ["json", "query", "rustls", "http2", "stream"] }
oauth2 = "5.0"
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }
url = "2.5"
axum = "0.8.9"
tower = "0.5.3"
tower-http = "0.6.11"

# LSP types - shared across packages
lsp-types = "0.97"

# Schema and validation
schemars = { version = "^1.2.1", features = ["derive"] }
secrecy = "0.10"

# Utilities
chrono = { version = "^0.4.45", features = ["serde"] }
time = "=0.3.55"
uuid = { version = "1.23", features = ["v4"] }
regex = "^1.12.4"
sha2 = "0.11"
base16ct = { version = "1.0", features = ["alloc"] }
base64 = "0.23"
rand = "0.10"
dirs = "6.0"
serde_yml = "0.0.13"
htmd = "0.5"
dom_smoothie = "0.18"

# Encryption
age = "0.12.1"

# Error handling
thiserror = "2.0"

# Storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Unix-specific
nix = { version = "0.31", default-features = false }
libc = "0.2"

# File system and pattern matching
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
glob = "0.3"
globset = "0.4"
grep = "0.4.1"
ignore = "0.4"
ast-grep-core = "0.45"
ast-grep-language = "0.45"

# Terminal UI
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "scrolling-regions"] }
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
nucleo = "0.5.0"
mime_guess = "2"
similar = "3.1.1"
unicode-width = "0.2.2"

# Testing
tempfile = "3.27"
async-trait = "0.1"
testcontainers = "0.28.0"

[profile.dev]
debug = 1

[profile.dist]
inherits = "release"
lto = "thin"
