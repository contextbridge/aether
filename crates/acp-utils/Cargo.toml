[package]
name = "aether-acp-utils"
version = "0.3.31"
edition = "2024"
description = "Agent Client Protocol (ACP) utilities for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["acp", "aether", "agent", "protocol"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.dist]
dist = false

[lib]
name = "acp_utils"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["client", "server"]
client = []
server = []
testing = ["client"]

[dependencies]
agent-client-protocol = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
rmcp = { workspace = true, features = ["client", "elicitation"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", version = "0.5.25" }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "process", "time"] }
tracing = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.10" }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
aether-acp-utils = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
