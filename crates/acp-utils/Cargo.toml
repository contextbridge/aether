[package]
name = "aether-acp-utils"
version = "0.5.6"
edition = "2024"
description = "Agent Client Protocol (ACP) utilities for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["acp", "aether", "agent", "protocol"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.dist]
dist = false

[lib]
name = "acp_utils"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["client"]
client = []
testing = ["client"]
websocket = ["dep:tokio-tungstenite"]

[dependencies]
agent-client-protocol = { workspace = true }
clankerdiff-protocol = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "time"] }
tracing = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.16" }
thiserror = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
llm = { package = "aether-llm", path = "../llm", version = "0.9.6" }
rmcp = { workspace = true, features = ["client", "elicitation"] }

[target.'cfg(target_family = "wasm")'.dependencies]
agent-client-protocol = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-futures = { workspace = true }

[[example]]
name = "fake_agent_ws"
required-features = ["testing", "websocket"]

[dev-dependencies]
aether-acp-utils = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true, features = ["compat"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
