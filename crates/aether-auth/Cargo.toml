[package]
name = "aether-auth"
version = "0.1.18"
edition = "2024"
description = "OAuth credential storage, authorization flows and AWS SigV4 signing for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"

[package.metadata.dist]
dist = false

[lints]
workspace = true

[features]
default = []
keyring = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:dbus-secret-service-keyring-store",
]
mcp = ["dep:rmcp"]
sigv4 = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4"]

[dependencies]
age = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "net", "time"] }
tracing = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.19" }

# keyring feature
keyring-core = { workspace = true, optional = true }

# mcp feature
rmcp = { workspace = true, optional = true, features = ["auth", "client"] }
oauth2 = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

# sigv4 feature
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
