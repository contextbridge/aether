[package]
name = "aether-agent-cli"
version = "0.9.3"
edition = "2024"
description = "CLI and ACP server for the Aether AI coding agent"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
homepage = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["ai", "agent", "cli", "acp", "coding"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
formula = "aether"

[lints]
workspace = true

[lib]
name = "aether_cli"
path = "src/lib.rs"

[[bin]]
name = "aether"
path = "src/main.rs"

[features]
testing = ["acp_utils/testing"]

[dependencies]
aether-auth = { path = "../aether-auth", version = "0.1.15", features = ["keyring"] }
base64 = { workspace = true }
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.8.2" }
aether-sessions = { workspace = true }
aether-project = { path = "../aether-project", version = "0.5.46" }
aether-telemetry = { path = "../aether-telemetry", version = "0.3.2" }
llm = { package = "aether-llm", path = "../llm", features = ["bedrock", "codex"], version = "0.9.2" }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", version = "0.7.2" }
mcp-servers = { package = "aether-mcp-servers", path = "../mcp-servers", features = ["all"], version = "0.6.3" }
wisp = { package = "aether-wisp", path = "../wisp", version = "0.7.2" }
ratatui = { workspace = true }
acp_utils = { package = "aether-acp-utils", path = "../acp-utils", features = ["websocket"], version = "0.5.2" }
agent-client-protocol = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-protocol = { workspace = true }
clankerdiff-server = { workspace = true }
aether-lspd = { path = "../aether-lspd", version = "0.1.37" }
rmcp = { workspace = true, features = ["client", "elicitation", "server", "transport-streamable-http-client-reqwest"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "net", "fs", "time", "signal", "process"] }
tokio-tungstenite = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-util = { workspace = true, features = ["compat"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.15" }
tempfile = { workspace = true }
crossterm = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
aether-agent-cli = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
acp_utils = { package = "aether-acp-utils", path = "../acp-utils", features = ["testing"], version = "0.5.2" }
