[package]
name = "aether-agent-core"
version = "0.7.0"
edition = "2024"
description = "A minimal Rust library for building AI agents with MCP tool integration"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["ai", "agent", "mcp", "llm", "async"]
categories = ["asynchronous", "api-bindings"]

[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "aether_core"
path = "src/lib.rs"

[dependencies]
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
sha2 = { workspace = true }
base16ct = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
async-openai = { workspace = true }
rmcp = { workspace = true, features = ["client", "server", "elicitation"] }
schemars = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
acp_utils = { package = "aether-acp-utils", path = "../acp-utils", default-features = false, version = "0.4.0" }
glob = { workspace = true }
regex = { workspace = true }
aether-auth = { path = "../aether-auth", version = "0.1.13" }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", version = "0.6.0" }
llm = { package = "aether-llm", path = "../llm", version = "0.8.0", features = ["codex"] }
utils = { package = "aether-utils", path = "../utils", version = "0.2.14" }
uuid = { workspace = true }
tempfile = { workspace = true, optional = true }

[features]
testing = ["dep:tempfile", "mcp_utils/testing"]

[dev-dependencies]
aether-core = { package = "aether-agent-core", path = ".", features = ["testing"] }
aether-doctest = { path = "../doctest" }
mcp-servers = { package = "aether-mcp-servers", path = "../mcp-servers", default-features = false, features = ["coding", "survey", "plan"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "basic_agent"
path = "examples/basic_agent.rs"
