[package]
name = "aether-agent-core"
version = "0.10.4"
edition = "2024"
description = "A minimal Rust library for building AI agents with MCP tool integration"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["ai", "agent", "mcp", "llm", "async"]
categories = ["asynchronous", "api-bindings"]

[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "aether_core"
path = "src/lib.rs"

[dependencies]
async-stream = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
noyalib = { workspace = true }
sha2 = { workspace = true }
base16ct = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
rmcp = { workspace = true, features = ["server", "elicitation", "macros"] }
base64 = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
aether-auth = { path = "../aether-auth", version = "0.1.23", features = ["sigv4"] }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", version = "0.8.1" }
llm = { package = "aether-llm", path = "../llm", version = "0.10.3", features = ["codex"] }
foxfire-acp = { workspace = true, default-features = false }
utils = { package = "aether-utils", path = "../utils", version = "0.4.1" }
uuid = { workspace = true }
tempfile = { workspace = true, optional = true }

[features]
testing = ["dep:tempfile", "mcp_utils/testing"]

[dev-dependencies]
aether-core = { package = "aether-agent-core", path = ".", features = ["testing"] }
aether-doctest = { path = "../doctest" }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "basic_agent"
path = "examples/basic_agent.rs"
