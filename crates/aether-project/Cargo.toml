[package]
name = "aether-project"
version = "0.5.56"
edition = "2024"
description = "Project-local settings and agent discovery for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["aether", "agent", "configuration"]
categories = ["development-tools"]

[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.9.2" }
llm = { package = "aether-llm", path = "../llm", version = "0.9.11" }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", version = "0.7.11" }
utils = { package = "aether-utils", path = "../utils", version = "0.2.18" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
noyalib = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }
tempfile = { workspace = true, optional = true }

[features]
testing = ["dep:tempfile"]

[dev-dependencies]
aether-project = { package = "aether-project", path = ".", features = ["testing"] }
aether-doctest = { path = "../doctest" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
