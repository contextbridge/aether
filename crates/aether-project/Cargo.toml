[package]
name = "aether-project"
version = "0.5.65"
edition = "2024"
description = "Project-local settings and agent discovery for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["aether", "agent", "configuration"]
categories = ["development-tools"]

[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.9.11" }
llm = { package = "aether-llm", path = "../llm", version = "0.9.20" }
utils = { package = "aether-utils", path = "../utils", version = "0.3.2" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
noyalib = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }

[features]
testing = ["utils/testing"]

[dev-dependencies]
aether-project = { package = "aether-project", path = ".", features = ["testing"] }
aether-doctest = { path = "../doctest" }
