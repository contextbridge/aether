[package]
name = "aether-schemas"
version = "0.2.23"
edition = "2024"
description = "Schema generation utilities for Aether SDK codegen"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
keywords = ["aether", "schema", "codegen"]
categories = ["development-tools"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
aether-cli = { package = "aether-agent-cli", path = "../aether-cli", version = "0.9.18" }
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.9.7" }
aether-evals = { path = "../aether-evals", version = "0.4.0" }
aether-project = { path = "../aether-project", version = "0.5.61" }
llm = { package = "aether-llm", path = "../llm", version = "0.9.16" }
utils = { package = "aether-utils", path = "../utils", version = "0.3.0" }
