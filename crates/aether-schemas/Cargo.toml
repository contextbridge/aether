[package]
name = "aether-schemas"
version = "0.1.6"
edition = "2024"
description = "Schema generation utilities for Aether SDK codegen"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
keywords = ["aether", "schema", "codegen"]
categories = ["development-tools"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
aether-cli = { package = "aether-agent-cli", path = "../aether-cli", version = "0.7.22" }
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.6.20" }
aether-evals = { path = "../aether-evals", version = "0.2.11" }
aether-project = { path = "../aether-project", version = "0.5.20" }
schemars = { workspace = true }
serde_json = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.9" }
