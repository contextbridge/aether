[package]
name = "aether-session-index"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.dist]
dist = false

[lints]
workspace = true

[lib]
name = "aether_session_index"
path = "src/lib.rs"

[[bin]]
name = "aether-session-index"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
utils = { package = "aether-utils", path = "../utils" }
aether-sessions = { workspace = true, features = ["analytics"] }
