[package]
name = "aether-telemetry"
version = "0.1.0"
edition = "2024"
description = "OpenTelemetry support for Aether GenAI calls"
license = "MIT"
repository = "https://github.com/contextbridge/aether"

[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.6.18" }
llm = { package = "aether-llm", path = "../llm", version = "0.7.16" }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.32.1", features = ["semconv_experimental"] }
http = "1"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.6.18", features = ["testing"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "rt-tokio", "testing"] }
tokio = { workspace = true, features = ["test-util"] }
