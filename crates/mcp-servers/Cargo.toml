[package]
name = "aether-mcp-servers"
version = "0.9.4"
edition = "2024"
description = "Built-in MCP tool servers for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["mcp", "aether", "agent", "tools"]
categories = ["development-tools"]

[lib]
name = "mcp_servers"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[features]
default = ["coding", "skills", "tasks", "subagents"]
test-helpers = ["utils/testing"]
file-ops = []
coding = [
    "file-ops",
    "dep:aether-project",
    "dep:clankerdiff-lspd",
    "dep:futures",
    "dep:tracing",
    "dep:lsp-types",
    "dep:reqwest",
    "dep:chrono",
    "dep:htmd",
    "dep:dom_smoothie",
    "dep:url",
]
skills = ["dep:aether-project", "dep:regex", "dep:tracing", "rmcp/skills-fs"]
tasks = [
    "dep:chrono",
    "dep:tempfile",
    "dep:uuid",
]
subagents = [
    "coding",
    "skills",
    "tasks",
    "dep:aether-auth",
    "dep:aether-core",
    "dep:aether-project",
    "dep:llm",
    "dep:futures",
]

[dependencies]
# Always required
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "fs", "process", "time"] }
libc = { workspace = true }
rmcp = { workspace = true, features = ["elicitation", "macros", "server"] }
schemars = { workspace = true }
clap = { workspace = true, features = ["env"] }
thiserror = { workspace = true }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", default-features = false, version = "0.8.1" }
foxfire-acp = { workspace = true, default-features = false }
utils = { package = "aether-utils", path = "../utils", version = "0.4.1" }
clankerdiff-lspd = { workspace = true, features = ["daemon"], optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
htmd = { workspace = true, optional = true }
dom_smoothie = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# skills feature
regex = { workspace = true, optional = true }

# tasks feature
tempfile = { workspace = true, optional = true }

# subagents feature
aether-auth = { path = "../aether-auth", optional = true, version = "0.1.23", features = ["keyring"] }
aether-core = { package = "aether-agent-core", path = "../aether-core", optional = true, version = "0.10.4" }
aether-project = { path = "../aether-project", optional = true, version = "0.6.4" }
llm = { package = "aether-llm", path = "../llm", optional = true, version = "0.10.3" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
clankerdiff-lspd = { workspace = true, features = ["test-support"] }
mcp-servers = { package = "aether-mcp-servers", path = ".", features = ["test-helpers"] }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", features = ["testing"], version = "0.8.1" }
aether-core = { package = "aether-agent-core", path = "../aether-core", features = ["testing"], version = "0.10.4" }

[[bin]]
name = "mcp-servers-stdio"
path = "src/bin/stdio.rs"
required-features = ["subagents"]

[[example]]
name = "lsp_diagnostics"
path = "examples/lsp_diagnostics.rs"
required-features = ["coding"]
