[package]
name = "aether-mcp-servers"
version = "0.8.10"
edition = "2024"
description = "Built-in MCP tool servers for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
homepage = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["mcp", "aether", "agent", "tools"]
categories = ["development-tools"]

[lib]
name = "mcp_servers"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[features]
default = ["coding", "skills", "tasks", "subagents", "review"]
test-helpers = ["utils/testing"]
file-ops = []
coding = [
    "file-ops",
    "dep:aether-project",
    "dep:aether-lspd",
    "dep:futures",
    "dep:tracing",
    "dep:lsp-types",
    "dep:reqwest",
    "dep:chrono",
    "dep:htmd",
    "dep:dom_smoothie",
    "dep:url",
]
skills = ["dep:aether-project", "dep:regex"]
tasks = [
    "dep:chrono",
    "dep:tempfile",
]
review = ["dep:axum", "dep:uuid", "dep:reqwest", "dep:tokio-util", "dep:tower-http", "tokio/net"]
subagents = [
    "coding",
    "skills",
    "tasks",
    "review",
    "dep:aether-auth",
    "dep:aether-core",
    "dep:aether-project",
    "dep:llm",
    "dep:futures",
]

[dependencies]
# Always required
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "fs", "process", "time"] }
libc = { workspace = true }
rmcp = { workspace = true, features = ["elicitation", "macros", "server"] }
schemars = { workspace = true }
clap = { workspace = true, features = ["env"] }
thiserror = { workspace = true }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", default-features = false, version = "0.7.16" }
utils = { package = "aether-utils", path = "../utils", version = "0.3.0" }
aether-lspd = { path = "../aether-lspd", optional = true, version = "0.3.7" }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
htmd = { workspace = true, optional = true }
dom_smoothie = { workspace = true, optional = true }
url = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["fs"] }

# skills feature
regex = { workspace = true, optional = true }

# tasks feature
tempfile = { workspace = true, optional = true }

# subagents feature
aether-auth = { path = "../aether-auth", optional = true, version = "0.1.20", features = ["keyring"] }
aether-core = { package = "aether-agent-core", path = "../aether-core", optional = true, version = "0.9.9" }
aether-project = { path = "../aether-project", optional = true, version = "0.5.63" }
llm = { package = "aether-llm", path = "../llm", optional = true, version = "0.9.18" }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
aether-lspd = { path = "../aether-lspd", features = ["testing"], version = "0.3.7" }
mcp-servers = { package = "aether-mcp-servers", path = ".", features = ["test-helpers"] }
mcp_utils = { package = "aether-mcp-utils", path = "../mcp-utils", features = ["testing"], version = "0.7.16" }
aether-core = { package = "aether-agent-core", path = "../aether-core", features = ["testing"], version = "0.9.9" }

[[bin]]
name = "mcp-servers-stdio"
path = "src/bin/stdio.rs"
required-features = ["subagents"]

[[example]]
name = "lsp_diagnostics"
path = "examples/lsp_diagnostics.rs"
required-features = ["coding"]
