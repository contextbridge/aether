[package]
name = "aether-mcp-utils"
version = "0.7.11"
edition = "2024"
description = "MCP client and server utilities for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["mcp", "aether", "agent", "tools"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.dist]
dist = false

[lib]
name = "mcp_utils"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["client", "oauth", "stdio", "ipc"]
testing = ["client", "dep:axum", "rmcp/transport-streamable-http-server"]
client = [
    "dep:async-stream",
    "dep:reqwest",
    "rmcp/transport-streamable-http-client-reqwest",
]
oauth = ["client", "dep:aether-auth", "aether-auth/mcp"]
stdio = ["client", "rmcp/transport-child-process"]
ipc = []

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "time"] }
tokio-util = { workspace = true }
rmcp = { workspace = true, features = ["client", "elicitation", "server", "transport-async-rw"] }
tracing = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.18" }
schemars = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# client deps
async-stream = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

# oauth deps
aether-auth = { path = "../aether-auth", version = "0.1.16", optional = true }

# testing deps
axum = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
mcp_utils = { package = "aether-mcp-utils", path = ".", features = ["testing"] }
aether-doctest = { path = "../doctest" }
rmcp = { workspace = true, features = ["macros", "transport-streamable-http-server"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true }
