[package]
name = "aether-mcp-utils"
version = "0.7.14"
edition = "2024"
description = "MCP client and server utilities for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["mcp", "aether", "agent", "tools"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.dist]
dist = false

[lib]
name = "mcp_utils"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["client"]
testing = ["client", "dep:axum", "rmcp/transport-streamable-http-server"]
client = [
    "dep:aether-auth",
    "aether-auth/sigv4",
    "dep:async-stream",
    "dep:async-trait",
    "dep:chrono",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sse-stream",
    "dep:sse-stream-rmcp",
    "dep:tokio-stream",
    "dep:utils",
    "rmcp/auth",
    "rmcp/transport-streamable-http-client-reqwest",
    "rmcp/transport-child-process",
]

[dependencies]
futures = { workspace = true }
rmcp = { workspace = true, features = ["client", "elicitation", "server", "transport-async-rw", "transport-io"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

# client-only deps
axum = { workspace = true, optional = true }
aether-auth = { path = "../aether-auth", version = "0.1.18", optional = true }
async-stream = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sse-stream = { workspace = true, optional = true }
# rmcp 3.5's StreamableHttpClient trait uses Sse from sse-stream 0.2.x.
sse-stream-rmcp = { package = "sse-stream", version = "0.2.6", optional = true }
tokio-stream = { workspace = true, features = ["sync"], optional = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.19", optional = true }

[[test]]
name = "client"
required-features = ["testing"]

[[test]]
name = "oauth"
required-features = ["testing"]

[[test]]
name = "gateway"
required-features = ["testing"]

[[test]]
name = "server"
required-features = ["testing"]

[[test]]
name = "http_headers"
required-features = ["testing"]

[[test]]
name = "sigv4"
required-features = ["testing"]

[dev-dependencies]
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true, features = ["macros", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
