[package]
name = "aether-mcp-utils"
version = "0.5.34"
edition = "2024"
description = "MCP client and server utilities for the Aether AI agent framework"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["mcp", "aether", "agent", "tools"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.dist]
dist = false

[lib]
name = "mcp_utils"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["client"]
testing = ["client"]
client = [
    "dep:aether-auth",
    "aether-auth/mcp",
    "dep:async-stream",
    "dep:llm",
    "dep:reqwest",
    "rmcp/transport-streamable-http-client-reqwest",
    "rmcp/transport-child-process",
]

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "time"] }
tokio-util = { workspace = true }
rmcp = { workspace = true, features = ["client", "elicitation", "server", "transport-async-rw"] }
tracing = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.2.13" }
schemars = { workspace = true }

# client-only deps
aether-auth = { path = "../aether-auth", version = "0.1.12", optional = true }
async-stream = { workspace = true, optional = true }
llm = { package = "aether-llm", path = "../llm", optional = true, version = "0.7.29" }
serde_json = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
aether-doctest = { path = "../doctest" }
rmcp = { workspace = true, features = ["macros"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
