[package]
name = "aether-wisp"
version = "0.7.19"
edition = "2024"
description = "A terminal UI for AI coding agents via the Agent Client Protocol (ACP)"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["tui", "ai", "agent", "acp", "terminal"]
categories = ["command-line-interface"]

[package.metadata.dist]
dist = false

[features]
testing = ["acp_utils/testing", "client_core/testing"]

[lib]
name = "wisp"
path = "src/lib.rs"

[[bin]]
name = "wisp"
path = "src/main.rs"

[[test]]
name = "tui"
path = "tests/tui/main.rs"
required-features = ["testing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
clankerdiff-core = { workspace = true }
clankerdiff-ratatui = { workspace = true }
clankerdiff-client = { workspace = true }
utils = { package = "aether-utils", path = "../utils", version = "0.3.0" }
acp_utils = { package = "aether-acp-utils", path = "../acp-utils", features = ["client"], version = "0.5.18" }
client_core = { package = "aether-client-core", path = "../client-core", version = "0.1.0" }
agent-client-protocol = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "process", "time"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nucleo = { workspace = true }
url = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
acp_utils = { package = "aether-acp-utils", path = "../acp-utils", features = ["client", "testing"], version = "0.5.18" }
serde_json = { workspace = true }
tempfile = { workspace = true }
utils = { package = "aether-utils", path = "../utils", features = ["testing"], version = "0.3.0" }
