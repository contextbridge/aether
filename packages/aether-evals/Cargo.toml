[package]
name = "aether-evals"
version = "0.2.1"
edition = "2024"
description = "Dockerized eval harness for Aether AI agents"
license = "MIT"
repository = "https://github.com/contextbridge/aether"
readme = "README.md"
keywords = ["aether", "agent", "eval", "testing"]
categories = ["development-tools::testing"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
aether-core = { package = "aether-agent-core", path = "../aether-core", version = "0.6.9" }
aether-project = { path = "../aether-project", version = "0.5.10" }
llm = { package = "aether-llm", path = "../llm", version = "0.7.8" }
testcontainers = { workspace = true }

[lib]
name = "aether_evals"
path = "src/lib.rs"
