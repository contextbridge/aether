packages:
  - "packages/*"

catalogPrune: true
minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - "@aether-agent/*"

allowBuilds:
  "@aether-agent/cli": true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

overrides:
  archiver-utils>glob: ^14.0.3
  readdir-glob>minimatch: ^11.0.4
